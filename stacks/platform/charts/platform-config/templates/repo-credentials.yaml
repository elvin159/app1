# Argo CD repository credentials, built from the read-only deploy key in Secrets Manager.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app1-repo
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager-{{ required "region is required" .Values.region }}
  target:
    name: app1-repo
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: {{ required "repo.url is required" .Values.repo.url | quote }}
        sshPrivateKey: {{ "'{{ .sshPrivateKey }}'" }}
  data:
    - secretKey: sshPrivateKey
      remoteRef:
        key: {{ required "repo.secretName is required" .Values.repo.secretName | quote }}
