# RDS master credentials from Secrets Manager, synced into the db-credentials Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.name }}-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ required "database.secretStore is required" .Values.database.secretStore }}
  target:
    name: {{ .Values.name }}-db
  data:
    - secretKey: username
      remoteRef:
        key: {{ required "database.secretArn is required" .Values.database.secretArn | quote }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.database.secretArn | quote }}
        property: password
