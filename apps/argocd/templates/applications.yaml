{{- range $name, $app := .Values.apps }}
{{- $deploy := index $.Values $name | default dict }}
{{- /* Nothing to run until the app's first version is set. */}}
{{- if $deploy.version }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ $.Values.repoURL | quote }}
    # The chart and the image come from the same commit, so both are promoted together.
    targetRevision: {{ $deploy.version | quote }}
    path: {{ $app.path | quote }}
    helm:
      valuesObject:
        {{- $values := mergeOverwrite (deepCopy $app.values) (dict "image" (dict "tag" $deploy.version)) }}
        {{- toYaml $values | nindent 8 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: app1
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}
{{- end }}
