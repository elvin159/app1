# stg: everything that differs between environments lives in this file.
# Every Terraform root in this folder reads it, and so do the workflows. Roots take the environment
# and region from their folder names: <env>/<region>/<stack> and <env>/global.

account_id: "222222222222"
primary_region: us-east-1 # writer database, ECR pushes, the global stack
regions:
  us-east-1:
    cluster_name: app1-stg-use1
    vpc_cidr: 10.32.0.0/16 # unique across every environment and region
    az_count: 3
  us-west-1: # cross-region read replica of the database; same apps behind the same hostnames
    cluster_name: app1-stg-usw1
    vpc_cidr: 10.33.0.0/16
    az_count: 2 # us-west-1 has two AZs

protection: standard # none (dev), standard (stg) or strict (prd)
force_destroy: false
log_retention_days: 90
kms_key_deletion_window_days: 30

networking:
  single_nat_gateway: false

compute:
  kubernetes_version: "1.35" # matches the Cluster Autoscaler release in stacks/platform
  node_instance_types: [m7i.large, m6i.large]
  node_capacity_type: ON_DEMAND
  node_min_size: 2
  node_max_size: 6

database:
  instance_class: db.m7g.large
  multi_az: true
  allocated_storage: 100
  max_allocated_storage: 500
  backup_retention_days: 14
  apply_immediately: false

apps:
  replicas: 2

# Image promotion: dev -> stg -> prd. Each environment copies the image from the previous one.
promotion:
  source_account_id: "111111111111"
  target_account_id: "333333333333"

# Bootstrap prerequisites (stub values).
state_bucket: app1-terraform-state-222222222222
domain: stg.example.com
hosted_zone_id: Z0000000000000000STG
runner_egress_cidr: 203.0.113.20/32
github_repo: elvin159/app1
deploy_subject: repo:elvin159/app1:environment:stg # the only workflows allowed to deploy apps here
argocd_repo_ssh_secret: app1/argocd-repo-ssh-key
alarm_emails: [alerts@example.com]
