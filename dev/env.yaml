# dev: everything that differs between environments lives in this file.
# Every Terraform root in this folder reads it, and so do the workflows. Roots take the environment
# and region from their folder names: <env>/<region>/<stack> and <env>/global.

account_id: "111111111111"
primary_region: us-east-1 # writer database, ECR pushes, the global stack
regions:
  us-east-1:
    cluster_name: app1-dev-use1
    vpc_cidr: 10.16.0.0/16 # unique across every environment and region
    az_count: 3

protection: none # none (dev), standard (stg) or strict (prd)
force_destroy: true # dev only: buckets and repositories can be destroyed with content
log_retention_days: 30
kms_key_deletion_window_days: 7

networking:
  single_nat_gateway: true # dev only: one NAT gateway instead of one per AZ

compute:
  kubernetes_version: "1.35" # matches the Cluster Autoscaler release in stacks/platform
  node_instance_types: [m7i.large, m6i.large, m5.large]
  node_capacity_type: SPOT
  node_min_size: 2
  node_max_size: 5

database:
  instance_class: db.t4g.small
  multi_az: false
  allocated_storage: 20
  max_allocated_storage: 50
  backup_retention_days: 7
  apply_immediately: true

apps:
  replicas: 2

# Image promotion: dev -> stg -> prd. Each environment copies the image from the previous one.
promotion:
  source_account_id: null
  target_account_id: "222222222222"

# Bootstrap prerequisites (stub values).
state_bucket: app1-terraform-state-111111111111
domain: dev.example.com
hosted_zone_id: Z0000000000000000DEV
runner_egress_cidr: 203.0.113.10/32
github_repo: elvin159/app1
deploy_subject: repo:elvin159/app1:ref:refs/heads/main # the only workflows allowed to deploy apps here
argocd_repo_ssh_secret: app1/argocd-repo-ssh-key
alarm_emails: [alerts@example.com]
