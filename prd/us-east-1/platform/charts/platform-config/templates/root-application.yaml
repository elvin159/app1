# Root of app-of-apps. Renders one Application per app from apps/argocd, using the version files in
# Git and the infrastructure values from Terraform.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app1
  namespace: {{ .Release.Namespace }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: {{ .Values.repo.url | quote }}
      targetRevision: main
      path: {{ required "root.path is required" .Values.root.path | quote }}
      helm:
        valueFiles:
          {{- toYaml .Values.root.valueFiles | nindent 10 }}
        valuesObject:
          {{- toYaml .Values.root.values | nindent 10 }}
    - repoURL: {{ .Values.repo.url | quote }}
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Release.Namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
