# External Secrets reads AWS Secrets Manager with its own IRSA role, one store per region it needs.
{{- range .Values.secretStoreRegions }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager-{{ . }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ . }}
{{- end }}
