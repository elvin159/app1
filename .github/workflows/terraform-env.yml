name: terraform-env

# Plans or applies one environment (see .github/scripts/terraform.sh for the order).
# Account and regions come from <environment>/env.yaml.
on:
  workflow_call:
    inputs:
      command:
        description: plan or apply.
        type: string
        required: true
      environment:
        type: string
        required: true

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  ENVIRONMENT: ${{ inputs.environment }}

jobs:
  plan:
    if: inputs.command == 'plan'
    # Bootstrapped runner: its egress IP is the only one allowed to the EKS API (platform stack).
    runs-on: [self-hosted, "app1-${{ inputs.environment }}"]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false
      - id: env
        run: echo "account_id=$(yq '.account_id' "$ENVIRONMENT/env.yaml")" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ steps.env.outputs.account_id }}:role/github-terraform-plan
          aws-region: us-east-1
      - run: .github/scripts/terraform.sh "$ENVIRONMENT" plan

  apply:
    if: inputs.command == 'apply'
    runs-on: [self-hosted, "app1-${{ inputs.environment }}"]
    # Required reviewers on the environment approve the apply.
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false
      - id: env
        run: echo "account_id=$(yq '.account_id' "$ENVIRONMENT/env.yaml")" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ steps.env.outputs.account_id }}:role/github-terraform-apply
          aws-region: us-east-1
      - run: .github/scripts/terraform.sh "$ENVIRONMENT" apply
