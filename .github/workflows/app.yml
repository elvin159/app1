name: app

# Build once, promote the same image: dev -> stg -> prd.
#
# The version of an app is the Git SHA of the last commit that changed apps/<app> or the shared chart
# (apps/chart). It is the image tag and the chart revision, so the image and its manifests move through
# the environments together.
#   test         every run: pytest and chart lint.
#   build        on main: build and push the image to dev, deploy it to dev.
#   promote-stg  copy the image dev -> stg by digest and deploy it. Gated by the stg environment.
#   promote-prd  copy the image stg -> prd by digest and deploy it. Gated by the prd environment.
# Deploying means committing the version to <env>/<region>/<app>/values.yaml; Argo CD syncs it.
on:
  workflow_call:
    inputs:
      app:
        description: backend or frontend.
        type: string
        required: true

permissions:
  contents: read

env:
  APP: ${{ inputs.app }}
  APP_DIR: apps/${{ inputs.app }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12" # matches the AlmaLinux 10 image
      - run: pip install -r "$APP_DIR/requirements-dev.txt"
      - run: pytest -v
        working-directory: ${{ env.APP_DIR }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1
      - run: helm lint apps/chart -f apps/chart/ci-values.yaml
      - run: helm template "$APP" apps/chart -f apps/chart/ci-values.yaml > /dev/null
      - run: helm lint apps/argocd -f apps/argocd/ci-values.yaml

  build:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the version
      id-token: write # OIDC to AWS
    outputs:
      version: ${{ steps.version.outputs.version }}
      stg_version: ${{ steps.version.outputs.stg_version }}
      prd_version: ${{ steps.version.outputs.prd_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Version
        id: version
        run: |
          echo "version=$(git log -1 --format=%H -- "$APP_DIR" apps/chart)" >> "$GITHUB_OUTPUT"
          echo "account_id=$(yq '.account_id' dev/env.yaml)" >> "$GITHUB_OUTPUT"
          echo "region=$(yq '.primary_region' dev/env.yaml)" >> "$GITHUB_OUTPUT"
          # Promotion updates every region together, so the primary region's file is representative.
          for env in stg prd; do
            echo "${env}_version=$(yq ".$APP.version" "$env/$(yq '.primary_region' "$env/env.yaml")/$APP/values.yaml")" >> "$GITHUB_OUTPUT"
          done
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ steps.version.outputs.account_id }}:role/github-app1-${{ inputs.app }}
          aws-region: ${{ steps.version.outputs.region }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - name: Build and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ${{ steps.ecr.outputs.registry }}/app1/${{ inputs.app }}:${{ steps.version.outputs.version }}
        run: |
          # Tags are immutable; a version is built exactly once.
          if aws ecr describe-images --repository-name "app1/$APP" --image-ids imageTag="$VERSION" > /dev/null 2>&1; then
            echo "$IMAGE already exists"
          else
            docker build -t "$IMAGE" "$APP_DIR"
            docker push "$IMAGE"
          fi
      - name: Sync static assets
        if: inputs.app == 'frontend'
        run: .github/scripts/sync-static.sh "$APP_DIR/static"
      - name: Deploy to dev
        run: .github/scripts/set-version.sh dev "$APP" "${{ steps.version.outputs.version }}"

  promote-stg:
    needs: build
    if: needs.build.outputs.version != needs.build.outputs.stg_version
    runs-on: ubuntu-latest
    environment: stg # required reviewers approve the promotion
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: ./.github/actions/promote
        with:
          app: ${{ inputs.app }}
          version: ${{ needs.build.outputs.version }}
          from: dev
          to: stg

  promote-prd:
    needs: [build, promote-stg]
    # Runs after a promotion to stg, or when stg already runs this version.
    if: >-
      always() && needs.build.result == 'success' &&
      (needs.promote-stg.result == 'success' || needs.promote-stg.result == 'skipped') &&
      needs.build.outputs.version != needs.build.outputs.prd_version
    runs-on: ubuntu-latest
    environment: prd
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: ./.github/actions/promote
        with:
          app: ${{ inputs.app }}
          version: ${{ needs.build.outputs.version }}
          from: stg
          to: prd
