name: terraform

# Pull request to main: fmt, validate, and a plan of every environment.
# Merge to main: apply dev, then stg, then prd. Each apply waits for its environment's required reviewers.
on:
  pull_request:
    branches: [main]
    paths: &paths
      - "stacks/**"
      - "*/env.yaml"
      - "*/global/**"
      - "*/*/networking/**"
      - "*/*/compute/**"
      - "*/*/database/**"
      - "*/*/identity/**"
      - "*/*/platform/**"
      - "*/*/observability/**"
      - ".github/workflows/terraform.yml"
      - ".github/workflows/terraform-env.yml"
      - ".github/scripts/terraform.sh"
  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

# One run at a time; never cancel an apply halfway.
concurrency:
  group: terraform
  cancel-in-progress: false

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
      - run: terraform fmt -check -recursive -diff stacks dev stg prd

  validate:
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false
      - name: terraform validate
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          # Every root (a folder with a lock file); the stacks are validated through them.
          for dir in $(find dev stg prd -name .terraform -prune -o -name .terraform.lock.hcl -print | xargs -n1 dirname | sort); do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

  plan:
    if: github.event_name == 'pull_request'
    needs: [fmt, validate]
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, stg, prd]
    uses: ./.github/workflows/terraform-env.yml
    with:
      command: plan
      environment: ${{ matrix.environment }}
    permissions:
      contents: read
      id-token: write

  apply-dev:
    if: github.event_name == 'push'
    needs: [fmt, validate]
    uses: ./.github/workflows/terraform-env.yml
    with:
      command: apply
      environment: dev
    permissions:
      contents: read
      id-token: write

  apply-stg:
    needs: apply-dev
    uses: ./.github/workflows/terraform-env.yml
    with:
      command: apply
      environment: stg
    permissions:
      contents: read
      id-token: write

  apply-prd:
    needs: apply-stg
    uses: ./.github/workflows/terraform-env.yml
    with:
      command: apply
      environment: prd
    permissions:
      contents: read
      id-token: write
